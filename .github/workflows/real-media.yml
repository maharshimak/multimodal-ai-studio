name: Real media integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Missing ffmpeg/ffprobe must fail these tests here, never skip them.
      MAKMA_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Real FFmpeg render and artifact verification
        run: python -m pytest -v -rs tests/test_real_ffmpeg_contract.py
